<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>העמוד האישי של חנה</title>
    <!-- ייבוא פונט Rubik מ-Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #7b2cbf;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .quote-icon {
            font-size: 36px;
            color: #9d4edd;
            margin-bottom: 15px;
            line-height: 1;
        }

        h1 {
            color: #2b2d42;
            font-size: 1.75rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background-color: #7b2cbf;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-back:hover {
            background-color: #5a189a;
            box-shadow: 0 6px 18px rgba(123, 44, 191, 0.35);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="subtitle">המשפט של חנה</div>
        <div class="quote-icon">❝</div>
        <h1>אמונה זה לא לראות ולהאמין, אלא לא לראות ולהאמין</h1>
        <a href="index.html" class="btn-back">חזרה לדף הבית</a>
    </div>

</body>
</html>
