<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>העמוד של רבקה עמאר </title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #f4efe8 0%, #e8d5c4 100%);
            text-align: center;
        }

        .card {
            background: #fffaf5;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(120, 72, 40, 0.15);
            display: inline-block;
            max-width: 500px;
            border: 1px solid #f0e0d0;
        }

        h1 {
            color: #b85c38;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            color: #5c4636;
        }

        .back {
            margin-top: 24px;
            display: inline-block;
            font-size: 14px;
            color: #8a6a55;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .back:hover {
            color: #b85c38;
            border-bottom-color: #b85c38;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>המשפט של רבקה</h1>
        <p>"אל תפחד לקפוץ, אי אפשר לחצות תהום בשני צעדים."</p>

        <a class="back" href="index.html">← חזרה לעמוד הבית</a>
    </div>

</body>

</html>
